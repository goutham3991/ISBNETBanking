name: Playwright Automation

on:
  # Run when code is pushed to main
  push:
    branches:
      - main

  # Run when a Pull Request is created/updated
  pull_request:
    branches:
      - main

  # Run automation suite every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Playwright Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # 5. Run complete automation suite
      - name: Run Playwright Tests
        run: npm test

      # 6. Upload Playwright HTML report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # 7. Upload test results
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      # 8. Upload Allure results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30